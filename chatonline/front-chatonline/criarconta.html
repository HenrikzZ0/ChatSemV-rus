<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua conta</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .botao {
            width: 200px;
            height: 50px;
            font-family: "Poppins", sans-serif;
            font-weight: 600;
            font-style: normal;
            font-size: 22px;
            border-radius: 40px;
            background-color: rgb(0, 255, 255);
            color: rgb(255, 255, 255);
            border: none;
        }
    </style>
    <script>
        function enviar() {
            const nome = document.getElementById("nome1").value;
            const senha = document.getElementById("senha1").value;

            if (!nome || !senha) {
                document.getElementById("preencha").style.display = 'flex'
                setTimeout(function(){window.location.href = "criarconta.html";}, 3000)
            }

            fetch("http://localhost:5000/cadastro", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ nome, senha })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                document.getElementById("bloco3").style.display = 'flex'
                setTimeout(function(){window.location.href = "logarconta.html";}, 3000)
                } else {
                    if (window.getComputedStyle(document.getElementById("preencha")).display === 'none') {
                        document.getElementById("bloco4").style.display = 'flex'
                    }
                }
            });
        }

    </script>
</head>
<body>
    <div id="container">
        <p class="fontbold" style="color: white; position: absolute; margin-left: -785px; font-size: 32px;">Cadastre-se e converse <br>com o mundo!</p>
        <div id="caixa" style="width: 750px; margin-left: 425px;">
            <h1 style="font-size: 45px; color: rgb(0, 200, 200);" class="fontbold">Crie uma conta</h1>
            <input type="text" id="nome1" placeholder="Digite um nome de usuário:" style="margin-top: 50px;">
            <input type="text" id="senha1" placeholder="Digite uma senha:" style="margin-top: 10px;">
             <div id="bloco3" style="display: none;">
                <p class="fontsemibold" style="color: rgb(0, 200, 200); font-size: 12px; position: absolute; margin-left: -309px;">Cadastro feito com sucesso!</p>
            </div>
             <div id="preencha" style="display: none;">
                <p class="fontsemibold" style="color: rgb(255, 0, 0); font-size: 12px; position: absolute; margin-left: -309px;">*Preencha todos os dados acima!</p>
            </div>
            <div id="bloco4" style="display: none;">
                <p class="fontsemibold" style="color: rgb(0, 200, 200); font-size: 12px; position: absolute; margin-left: -309px;">Usuário já existe! <a href="logarconta.html" rel="prev" class="link">Logue em sua conta</a>.</p>
            </div>
            <button onclick="enviar()" class="botao" style="margin-top: 50px;">Enviar</button>  
            <p style="margin-top: 50px;"><a href="logarconta.html" class="link" rel="prev">Voltar</a></p>      
        </div>
    </div>
    
</body>
</html>
