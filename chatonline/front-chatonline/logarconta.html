<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre na sua conta</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .botao {
            width: 200px;
            height: 50px;
            font-family: "Poppins", sans-serif;
            font-weight: 600;
            font-style: normal;
            font-size: 22px;
            border-radius: 40px;
            background-color: rgb(0, 255, 255);
            color: rgb(255, 255, 255);
            border: none;
        }

    </style>
    <script>
        function enviar() {
            const nome = document.getElementById("nome").value;
            const senha = document.getElementById("senha").value;

            fetch("http://localhost:5000/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ nome, senha })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                document.getElementById("bloco2").style.display = 'none';
                setTimeout(function() { window.location.href = "chat1.html";}, 3000)
            } 
            else {
                document.getElementById("bloco2").style.display = 'flex';
                document.getElementById("criarconta").style.display = 'flex';
            }
        });
        }

    </script>
</head>
<body>
    <div id="container">
        <p class="fontbold" style="color: white; position: absolute; margin-left: -785px; font-size: 30px;">Logue e desfrute do <br>melhor chat online do Brasil!</p>
        <div id="caixa" style="width: 750px; margin-left: 425px;">
            <h1 style="font-size: 45px; color: rgb(0, 200, 200);" class="fontbold">Entre em sua conta</h1>
            <input type="text" id="nome" placeholder="Digite seu nome de usuário:" style="margin-top: 50px;">
            <input type="text" id="senha" placeholder="Digite sua senha:" style="margin-top: 10px;">
            <div id="bloco2" style="display: none;">
                <p class="fontsemibold" style="color: rgb(255, 0, 0); font-size: 12px; position: absolute; margin-left: -309px;">*Nome ou senha incorretos!</p>
            </div>
            <button onclick="enviar()" class="botao" style="margin-top: 50px;">Enviar</button>
            <p style="margin-top: 50px; display: none;" id="criarconta"><a href="criarconta.html" class="link">Não tem uma conta? Crie uma.</a></p>
            <p style="margin-top: 50px;"><a href="index.html" class="link" rel="prev">Voltar</a></p>
        </div>
        
    </div>
</body>
</html>
